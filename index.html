<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shorts - Portafolio</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    /* CONTENEDOR DE LOS 3 CELULARES */
    .showcase {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: row;

      justify-content: center;
      align-items: center;

      gap: 35px;

      padding: 50px 30px;
    }

    /* CELULAR */
    .phone {
      position: relative;

      width: 230px;
      flex: 0 0 230px;

      padding: 8px;

      background: #101010;

      border: 3px solid #303030;
      border-radius: 34px;

      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    /* ISLA SUPERIOR */
    .dynamic-island {
      position: absolute;

      top: 14px;
      left: 50%;

      transform: translateX(-50%);

      width: 65px;
      height: 18px;

      background: #000;

      border-radius: 20px;

      z-index: 20;

      pointer-events: none;
    }

    /* PANTALLA */
    .screen {
      position: relative;

      width: 100%;
      aspect-ratio: 9 / 16;

      overflow: hidden;

      background: #000;

      border-radius: 26px;
    }

    /* YOUTUBE */
    .screen iframe {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;
    }

    /* TABLET / PANTALLA PEQUEÑA */
    @media (max-width: 800px) {

      .showcase {
        gap: 15px;
        padding: 30px 10px;
      }

      .phone {
        width: 30%;
        flex-basis: 30%;
      }
    }

  </style>
</head>


<body>

  <div class="showcase">


    <!-- CELULAR 1 -->
    <div class="phone">

      <div class="dynamic-island"></div>

      <div class="screen">

        <iframe
          src="https://www.youtube.com/embed/R8V02Wo-k4o"
          title="Short 1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>

      </div>

    </div>


    <!-- CELULAR 2 -->
    <div class="phone">

      <div class="dynamic-island"></div>

      <div class="screen">

        <iframe
          src="https://www.youtube.com/embed/Mpd_1QdjDbQ"
          title="Short 2"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>

      </div>

    </div>


    <!-- CELULAR 3 -->
    <div class="phone">

      <div class="dynamic-island"></div>

      <div class="screen">

        <iframe
          src="https://www.youtube.com/embed/zH5cgwCqfdE"
          title="Short 3"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>

      </div>

    </div>


  </div>

</body>

</html>
